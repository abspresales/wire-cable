// 导入Excel（分块解析）
function handleExcelImport(event){
    const file=event.target.files[0];
    if(!file)return;
    if(typeof XLSX==='undefined'){alert('Excel解析库加载失败，请检查网络');event.target.value='';return;}
    const reader=new FileReader();
    reader.onload=function(e){
        try{
            const data=new Uint8Array(e.target.result);
            const wb=XLSX.read(data,{type:'array'});
            const imported=parseExcelWorkbook(wb);
            const importedHistory=parseHistorySheet(wb);
            console.log('解析到物料条数:', imported.length, ', 履历条数:', importedHistory.length);
            if(imported.length===0){alert('未解析到有效物料数据，请检查文件格式（F12控制台查看详情）');return;}
            const msg='确定覆盖当前全部数据？\n物料：'+rawData.length+' → '+imported.length+' 条\n履历：'+historyData.length+' → '+importedHistory.length+' 条';
            if(!confirm(msg))return;
            rawData=cleanRawData(imported);
            if(importedHistory.length>0)historyData=importedHistory;
            setDirty();
            // 刷新后台
            renderAdminRaw();updateAdminStats();
            // 刷新履历
            renderQueryHistory();
            // 重置速查页筛选条件为全部
            clearCombobox('qLine');
            clearCombobox('qSeries');
            clearCombobox('qType');
            setComboboxDisabled('qLength',true);
            clearCombobox('qLength');
            clearCombobox('qStandard');
            // 刷新速查页
            initQueryDropdowns();renderQueryTable();
            alert('导入成功！\n物料：'+imported.length+'条\n履历：'+historyData.length+'条\n筛选已重置为全部，请切换到线材速查页查看。\n👉 点击「📤 导出JSON」下载 wire-cable.json，再手动上传到 GitHub 即可更新线上。');
        }catch(err){console.error(err);alert('Excel解析失败：'+err.message+'\n请按F12查看控制台错误详情');}
    };
    reader.readAsArrayBuffer(file);
    event.target.value='';
}

function parseExcelWorkbook(wb){
    const allRows=[];
    // 表头中文名称 → RAW_FIELDS 字段 的映射(兼容表头含"\\n英文"或纯中文)
    const HEAD_MAP={
        '产品线':'产品线','产品系列':'产品系列','产品型号':'产品型号',
        '箱体尺寸':'箱体尺寸','箱体尺寸(W*H)':'箱体尺寸','线材类型':'线材类型',
        '线材规格':'线材规格','线材标准':'线材标准','线材长度':'线材长度',
        '料号':'料号','SAP料号':'料号','物料描述':'物料描述','备注':'备注'
    };
    wb.SheetNames.forEach(sheetName=>{
        try{
        if(String(sheetName).includes('履历'))return;   // 跳过履历类sheet(履历/修订履历/更新履历)
        const ws=wb.Sheets[sheetName];
        if(!ws)return;
        const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});
        if(!rows||rows.length<2)return;   // 至少需要表头+1行数据
        // 表头行(第0行)识别 → 建立 列索引→RAW_FIELDS字段 的映射
        const colMap=[];   // colMap[列号]=字段名
        const hrow=rows[0]||[];
        for(let c=0;c<hrow.length;c++){
            const cell=String(hrow[c]||'').trim();
            const zh=cell.split(/\n/)[0].trim();   // 取"产品线\\nProduct Line"的中文部分
            if(HEAD_MAP[zh]&&!colMap.includes(HEAD_MAP[zh]))colMap[c]=HEAD_MAP[zh];
        }
        // 若完全识别不到表头列(可能是旧格式/异常表),退回旧逻辑:跳过此sheet
        const detected=colMap.filter(Boolean);
        if(detected.length<3){console.warn('['+sheetName+'] 未能识别标准表头,跳过');return;}
        // 产品系列兜底:若表头没单独"产品系列"列,用sheet名补
        const hasSeriesCol=detected.includes('产品系列');
        // 逐行读取(行1起)
        for(let r=1;r<rows.length;r++){
            const row=rows[r];if(!row)continue;
            const obj={};
            colMap.forEach((fname,ci)=>{
                if(!fname)return;
                obj[fname]=String(row[ci]==null?'':row[ci]).trim();
            });
            // 若无产品系列列,用sheet名兜底(兼容旧"一个系列一个sheet"的命名习惯)
            if(!hasSeriesCol&&!obj['产品系列'])obj['产品系列']=sheetName;
            // 空行跳过(关键列全空)
            if(!obj['产品型号']&&!obj['料号']&&!obj['物料描述']&&!obj['产品系列'])continue;
            allRows.push(obj);
        }
        }catch(e){console.error('['+sheetName+'] 解析错误',e);}
    });
    return allRows;
}

function parseHistorySheet(wb){
    const history=[];
    let historySheet=null;
    // 查找履历sheet（兼容“履历/修订履历/更新履历”等含“履历”的命名）
    for(const name of wb.SheetNames){
        if(String(name).includes('履历')){historySheet=name;break;}
    }
    if(!historySheet){console.log('未找到履历sheet');return history;}
    const ws=wb.Sheets[historySheet];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});
    if(!rows||rows.length<2)return history;
    // 跳过表头，从第2行开始
    for(let i=1;i<rows.length;i++){
        const row=rows[i];
        if(!row)continue;
        const date=String(row[0]||'').trim();
        const content=String(row[1]||'').trim();
        const editor=String(row[2]||'').trim();
        if(!date&&!content)continue;
        history.push({'日期':date,'修订内容':content,'编辑人':editor});
    }
    console.log('解析到履历条数:', history.length);
    return history;
}

// 加载外部数据
async function loadDataFromJson(){
    try{
        // 给 fetch 加超时保护，避免在无 wire-cable.json 的环境无限挂起导致兜底无法执行
        const controller=new AbortController();
        const timeout=setTimeout(()=>controller.abort(),3000);
        const resp=await fetch('wire-cable.json',{signal:controller.signal});
        clearTimeout(timeout);
        if(!resp.ok)throw new Error('加载失败');
        const data=await resp.json();
        if(data.rawData&&data.rawData.length>0){
            rawData=data.rawData;
            historyData=data.historyData||[];
            console.log('已从 wire-cable.json 加载数据：'+rawData.length+' 条');
            return true;
        }
    }catch(e){
        console.warn('wire-cable.json 加载失败，将使用内嵌默认数据：'+(e&&e.message));
    }
    return false;
}

// 页面加载
async function initPage(){
    // 1. 先用内嵌默认数据立即渲染,确保任何环境下页面都有数据(不等网络)
    const hasLocal=autoLoadLocalStorage();
    if(!hasLocal||rawData.length===0){
        if(typeof DEFAULT_DATA!=='undefined'&&DEFAULT_DATA.rawData&&DEFAULT_DATA.rawData.length>0){
            rawData=DEFAULT_DATA.rawData;
            historyData=DEFAULT_DATA.historyData||[];
            console.log('已加载内嵌默认数据：'+rawData.length+'条');
        }
    }
    rawData=cleanRawData(rawData);
    bindGlobalSearch();
    refreshQueryPage();
    renderActiveFilters();
    // 2. 再异步尝试用外部 wire-cable.json 覆盖(成功才替换,失败静默用默认数据)
    loadDataFromJson().then(ok=>{
        if(ok){
            rawData=cleanRawData(rawData);
            refreshQueryPage();
            renderActiveFilters();
            console.log('已切换到 wire-cable.json 数据：'+rawData.length+' 条');
        }
    }).catch(()=>{});
}
document.addEventListener('DOMContentLoaded',initPage);
if(document.readyState!=='loading'){initPage();}

// ===== 更新履历浮窗逻辑 =====
function openHistoryModal() {
  document.getElementById('historyOverlay').classList.add('active');
  document.getElementById('historyModal').classList.add('active');
  document.body.style.overflow = 'hidden';
  renderHistoryModal();
}

function closeHistoryModal() {
  document.getElementById('historyOverlay').classList.remove('active');
  document.getElementById('historyModal').classList.remove('active');
  document.body.style.overflow = '';
}

// 统一格式化履历日期为 YYYY-MM-DD(兼容多种输入格式)
function fmtDate(s){
  s = String(s == null ? '' : s).trim();
  if (!s) return '';
  const datePart = s.split(' ')[0]; // 去掉时间部分
  const pad2 = n => String(n).padStart(2, '0');
  // 1) 年/月/日(首段4位): 2025-12-26 / 2025/12/26 / 2026/9/2 / 2025-02-14
  let m = datePart.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/);
  if (m) return m[1] + '-' + pad2(m[2]) + '-' + pad2(m[3]);
  // 2) 月/日/年(末段2位或4位, 首段非4位): 2/14/25 / 12/5/25 / 2/14/2025
  m = datePart.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2}|\d{4})$/);
  if (m) {
    let y = m[3];
    if (y.length === 2) y = '20' + y;
    return y + '-' + pad2(m[1]) + '-' + pad2(m[2]);
  }
  return s; // 无法识别则原样返回
}

function renderHistoryModal() {
  const body = document.getElementById('historyTableBody');
  // 跳过表头行
  const data = historyData.filter((item, idx) => !(idx === 0 && item['日期'] === '日  期'));
  const count = data.length;
  document.getElementById('historyModalCount').textContent = '共 ' + count + ' 条';
  if (count === 0) {
    body.innerHTML = '<tr><td colspan="3" class="no-result">暂无履历</td></tr>';
    return;
  }
  let lastDate = '';
  body.innerHTML = data.map(h => {
    const fullDate = fmtDate(h['日期']);
    const showDate = fullDate !== lastDate ? fullDate : '';
    lastDate = fullDate;
    return '<tr><td>' + esc(showDate) + '</td><td class="col-content">' + esc(h['修订内容'] || '') + '</td><td>' + esc(h['编辑人'] || '') + '</td></tr>';
  }).join('');
}

// ESC 关闭浮窗
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    if (document.getElementById('historyModal').classList.contains('active')) {
      closeHistoryModal();
    }
    if (document.getElementById('adminModal').classList.contains('active')) {
      closeAdminModal();
    }
  }
});

<script>
// ===== 深色/浅色主题切换（默认浅色，统一键 presales-theme，支持跨站同步）=====
(function(){
  var KEY='presales-theme';   // 统一主题键：工具中心/全部子站共用
  // 被工具中心 iframe 嵌套时隐藏自己的顶部抬头（避免与父站「Absen logo ｜ 站名」重复），独立打开时正常显示
  var brandBar=document.getElementById('brandBar');
  var inFrame=(window.self!==window.top);
  if(inFrame&&brandBar){brandBar.style.display='none';}
  function apply(){
    var t=localStorage.getItem(KEY)||'light';   // 默认浅色
    if(t!=='dark') t='light';
    document.documentElement.setAttribute('data-theme',t);
  }
  // 被工具中心（父页面）控制：监听 message + 同源 storage 事件即时同步
  window.addEventListener('message',function(e){
    var d=e.data||{};
    if(d&&d.type==='presales-theme'&&(d.theme==='dark'||d.theme==='light')){
      localStorage.setItem(KEY,d.theme);apply();
    }
  });
  window.addEventListener('storage',function(e){
    if(e.key===KEY){apply();}
  });
  apply();
})();
</script>
